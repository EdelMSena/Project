apply plugin: 'java'
apply plugin: 'eclipse'

eclipse.project.name = 'software eng'

def generatedMainSrc = layout.buildDirectory.dir("generated-src/main/java")

sourceSets {
	main {
		java {
			srcDirs = [generatedMainSrc.get().asFile]
		}
	}
	test {
		java {
			srcDirs = ['test']
		}
	}
}

tasks.register('mirrorSrcForCompile', Sync) {
	from('src')
	into generatedMainSrc
	include '**/*.java'
}

compileJava.dependsOn mirrorSrcForCompile
compileTestJava.dependsOn mirrorSrcForCompile

repositories {
	mavenCentral()
}

dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testImplementation 'org.mockito:mockito-core:5.10.0'
	implementation 'com.google.code.gson:gson:2.13.1'
	testImplementation 'fr.inria.gforge.spoon:spoon-core:10.4.0'
}

test {
	useJUnitPlatform()
}