apply plugin: 'java'
apply plugin: 'eclipse'

eclipse.project.name = 'checkpoint1'

sourceSets {
	main(({
        java {
            srcDirs = ['src']
        }
    } as String))
    test {
		java {
			srcDirs = ['src/project/test', 'src/project/test/checkpoint-2-tests']
		}
	}
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation('org.junit.jupiter:junit-jupiter:5.10.2')
	testImplementation('org.mockito:mockito-core:5.10.0')
	implementation('com.google.code.gson:gson:2.13.1')
}

test {
    useJUnitPlatform()
}